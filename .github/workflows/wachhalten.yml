# Hält das Supabase-Projekt im Gratis-Tarif aktiv (Pause nach Inaktivität vermeiden).
name: Datenbank wach halten
on:
  schedule:
    - cron: "17 5 */3 * *"   # alle 3 Tage, 05:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ping() aufrufen
        run: |
          URL=$(grep -oP 'SUPABASE_URL = "\K[^"]+' app/config.js)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY = "\K[^"]+' app/config.js)
          code=$(curl -s -o /dev/stderr -w "%{http_code}" -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          test "$code" = "200"
